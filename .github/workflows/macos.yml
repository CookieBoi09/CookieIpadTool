name: Build Lint for macOS
on:
  push:
    branches: [main, lint-macos]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lint-macos-build
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Compile universal Mac app
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { bash macos/scripts/build.sh && macos/build/Lint.app/Contents/MacOS/Lint --smoke-test; } 2>&1 | tee macos-build.log
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Lint-macOS
          path: |
            macos/build/Lint-macOS.zip
            macos/build/Lint-macOS.zip.sha256
            macos/build/Lint-macOS.dmg
            macos/build/Lint-macOS.dmg.sha256
          retention-days: 30
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish download and build diagnostics
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          mkdir -p pages/downloads
          cp macos-build.log pages/downloads/macos-build.log
          node -e 'require("fs").writeFileSync("pages/downloads/macos-build.json", JSON.stringify({commit:process.env.GITHUB_SHA,status:process.env.BUILD_OUTCOME,run:process.env.GITHUB_RUN_ID}))'
          if [ "$BUILD_OUTCOME" = success ]; then
            cp macos/build/Lint-macOS.zip macos/build/Lint-macOS.dmg macos/build/Lint-macOS.dmg.sha256 pages/downloads/
            shasum -a 256 pages/downloads/Lint-macOS.zip | sed 's|pages/downloads/||' > pages/downloads/Lint-macOS.zip.sha256
          fi
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/
          git diff --cached --quiet || git commit -m 'Publish macOS build output'
          git push origin HEAD:gh-pages
      - name: Report native build result
        if: steps.build.outcome != 'success'
        run: exit 1
